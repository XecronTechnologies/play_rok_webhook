<div class="sidebar">
    <div class="sidebar-header-row">
        <div class="header-label">Messages</div>

        <svg (click)="onDeleteClick()" class="delete-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            <line x1="10" y1="11" x2="10" y2="17"></line>
            <line x1="14" y1="11" x2="14" y2="17"></line>
        </svg>

        <div class="header-count">({{ hitList.length }}/1000)</div>
        <div class="retention-tag">24h</div>
    </div>

    <div class="sidebar-content">
        @for (item of hitList; track item.unix) {
        <div class="sidebar-item" (click)="onItemClick(item.id)">
            <div class="item-header-row">
                <div class="post-badge">POST</div>
                <div class="item-title">{{ item.text }}</div>
                <div class="request-id">#{{ item.id }}</div>
            </div>

            <div class="details-group">
                <div class="detail-text">Email</div>
                <div class="detail-separator">•</div>
                <div class="detail-text">Phone</div>
                <div class="detail-separator">•</div>
                <div class="detail-text">Address</div>
            </div>


            <div class="item-footer">
                <div class="time-stamp">{{ item.time }}</div>
                <div class="expiry-label">Expires in 24h</div>
            </div>
        </div>
        } @empty {
        <div class="empty-state">No messages received.</div>
        }
    </div>
</div>
